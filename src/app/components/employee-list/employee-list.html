<div class="list-container">
  <div class="header-actions">
    <h2 class="section-title">Employee Directory</h2>
    <div class="actions-group">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Employees</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. John Doe or Engineering" #input>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      
      <button mat-raised-button color="primary" class="add-btn" [routerLink]="['/employee/new']">
        <mat-icon>person_add</mat-icon> Add New
      </button>
    </div>
  </div>

  <div class="table-card mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let row">
          <div class="user-cell">
            <div class="avatar" [style.background-image]="'url(' + (row.imageUrl || 'https://i.pravatar.cc/150?u=' + row.id) + ')'"></div>
            <div class="user-info">
              <span class="user-name">{{row.firstName}} {{row.lastName}}</span>
              <span class="user-email text-secondary">{{row.email}}</span>
            </div>
          </div>
        </td>
      </ng-container>

      <!-- Department Column -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Department </th>
        <td mat-cell *matCellDef="let row"> 
          <span class="department-badge">{{row.department}}</span>
        </td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Role </th>
        <td mat-cell *matCellDef="let row"> {{row.role}} </td>
      </ng-container>

      <!-- Salary Column -->
      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Salary </th>
        <td mat-cell *matCellDef="let row"> {{row.salary | currency}} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let row">
          <mat-chip-listbox>
            <mat-chip-option [selectable]="false" [class]="getStatusClass(row.status)">
              {{row.status}}
            </mat-chip-option>
          </mat-chip-listbox>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" [routerLink]="['/employee', row.id]" matTooltip="Edit Employee">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteEmployee(row.id)" matTooltip="Delete Employee">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="row-hover"></tr>

      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">No employee matching the filter "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of employees"></mat-paginator>
  </div>
</div>
